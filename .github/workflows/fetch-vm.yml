name: Fetch Claude Cowork VM
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VM bundle from official CDN
        run: |
          SHA="37817e321a4a5cfd1b8a667aa82bff9a55fb8f3b"
          BASE="https://downloads.claude.ai/vms/linux/x64/$SHA"
          mkdir -p vm
          for f in rootfs.vhdx.zst vmlinuz.zst initrd.zst; do
            echo "== Downloading $f =="
            curl -sSL --retry 5 --retry-delay 3 -o "vm/$f" "$BASE/$f"
            ls -la "vm/$f"
          done

      - name: Verify checksums (sha256 of .zst files, per app manifest)
        run: |
          cd vm
          declare -A EXPECT=(
            [rootfs.vhdx.zst]="26227dd36dcafd0ba15cdf1e01cbb845446b9de22823eca3726457879ea7d0ee"
            [vmlinuz.zst]="586266512091f17cb49552d0fb72603b310e1b851b0acd80f68ee855ddb31025"
            [initrd.zst]="53455c9ccd4b5bcab137770a729a2ec121f64b5d9d34b521257e5512364865c3"
          )
          FAIL=0
          for f in "${!EXPECT[@]}"; do
            got=$(sha256sum "$f" | awk '{print $1}')
            if [ "$got" = "${EXPECT[$f]}" ]; then
              echo "OK  $f -> $got"
            else
              echo "MISMATCH $f: expected ${EXPECT[$f]} got $got"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] || exit 1

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: claude-vm-37817e
          name: Claude Cowork VM bundle (37817e)
          body: |
            Claude Desktop Cowork sandbox VM images (win32-x64, bundle 37817e)
            fetched from the official downloads.claude.ai CDN.
            Files are official .zst format.
          files: vm/*
          fail_on_unmatched_files: false
